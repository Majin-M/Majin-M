# Régénère chaque nuit l'image d'activité du profil (github-metrics.svg)
# avec lowlighter/metrics : en-tête, calendrier isométrique sur un an,
# langages les plus utilisés.
#
# Prérequis : un secret METRICS_TOKEN dans le dépôt (token personnel GitHub,
# portée « public_repo » suffisante), voir le README du portfolio.
name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Majin-M
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          config_display: large
          config_octicon: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
