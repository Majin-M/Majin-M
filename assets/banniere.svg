<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  @keyframes allumer { from { opacity: .12 } to { opacity: 1 } }
  @keyframes tracer { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
  @keyframes apparaitre { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes pouls { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .allume { animation: allumer .8s ease both; }
  .trace { stroke-dasharray: 1; animation: tracer 1.6s cubic-bezier(.3,.7,.2,1) both; }
  .apparait { animation: apparaitre .9s ease both; }
  .pouls { animation: pouls 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .particule { display: none; } }
</style>
