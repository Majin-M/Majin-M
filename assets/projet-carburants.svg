<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Prix des carburants, projet en cours : ingestion quotidienne des prix de 9 800 stations, 2 étapes sur 6 réalisées.">
<title>Prix des carburants, projet en cours : ingestion quotidienne des prix de 9 800 stations, 2 étapes sur 6 réalisées.</title>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  @keyframes allumer { from { opacity: .12 } to { opacity: 1 } }
  @keyframes tracer { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
  @keyframes apparaitre { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes pouls { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .allume { animation: allumer .8s ease both; }
  .trace { stroke-dasharray: 1; animation: tracer 1.6s cubic-bezier(.3,.7,.2,1) both; }
  .apparait { animation: apparaitre .9s ease both; }
  .pouls { animation: pouls 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .particule { display: none; } }
</style>
<defs>
  <radialGradient id="halo" cx="0.7" cy="0.55" r="0.7"><stop offset="0" stop-color="#d4703f" stop-opacity=".12"/><stop offset="1" stop-color="#d4703f" stop-opacity="0"/></radialGradient>
  <linearGradient id="estompe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="masque-grille"><rect width="600" height="360" fill="url(#estompe)"/></mask>
  <filter id="lueur" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="360"><feGaussianBlur stdDeviation="3" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="600" height="360" rx="14" fill="#0b0d0e"/>
<rect width="600" height="360" rx="14" fill="url(#halo)"/>
